name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-validation.txt
            requirements-examples.txt
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-validation.txt --requirement requirements-examples.txt
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Validate repository skills
        run: python3 scripts/validate_skills.py
      - name: Validate evaluation suites
        run: python3 evals/validate.py
      - name: Run Python tests
        run: |
          python3 -m unittest discover -s tests
          python3 -m unittest discover -s context-compression/tests
      - name: Run hook test
        run: bun test tests/leancode_hook.test.ts
